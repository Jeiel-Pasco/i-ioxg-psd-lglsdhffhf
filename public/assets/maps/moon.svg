<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" fill="none">
  <!-- Stylized equirectangular lunar albedo and crater silhouette map (original vector art, zero external requests) -->
  <g fill="#2b2f36" opacity="0.65">
